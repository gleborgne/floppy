<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- media-src : les extraits sonores des voix viennent des bibliothèques de modèles (http ou https) ; img-src : l'aperçu de l'avatar (data:). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src https: http:">
<title>Floppy — Bienvenue</title>
<link rel="stylesheet" href="./onboarding.css">
</head>
<body>
  <div id="app">
    <aside class="side">
      <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
      <div id="avatar" class="avatar" aria-hidden="true"></div>
      <ol id="pieces" class="pieces" aria-label="Mes quatre réglages"></ol>
    </aside>
    <section class="main">
      <main id="content" tabindex="-1"></main>
      <footer id="actions" class="actions"></footer>
    </section>
  </div>
  <script type="module" src="./onboarding.js"></script>
</body>
</html>
