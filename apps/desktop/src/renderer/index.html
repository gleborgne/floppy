<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; worker-src blob:; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:">
<title>Floppy</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="root">
    <section id="bubble" class="hide" aria-live="polite">
      <button id="openChat" type="button" title="Ouvrir la conversation" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg></button>
      <div id="scroll">
        <div id="you"></div>
        <div id="reply"></div>
      </div>
      <div id="listen" hidden><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="listenLabel">Je t'écoute…</span><button id="stopListening" type="button" title="Arrêter l'écoute" aria-label="Arrêter l'écoute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div>
      <div id="cards"></div>
    </section>
    <div id="faceWrap" title="Floppy — Ctrl+Alt+F pour parler">
      <div id="face"></div>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
