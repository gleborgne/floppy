<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floppy</title>
  <link rel="stylesheet" href="text.css">
  <script type="module" src="text.js"></script>
</head>
<body>
  <form id="request">
    <label for="prompt" id="label">Écrire à Floppy</label>
    <textarea id="prompt" maxlength="10000" autofocus required></textarea>
    <p id="hint">Entrée pour envoyer · Maj+Entrée pour une nouvelle ligne · Échap pour fermer</p>
    <p id="error" role="alert" hidden></p>
    <div class="actions"><button type="button" id="cancel">Annuler</button><button type="submit" id="send">Envoyer</button></div>
  </form>
</body>
</html>
